name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Unit and behavioral contract tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Critical production dependency audit
        run: pnpm audit --prod --audit-level critical
      - name: Generate dependency inventory
        run: pnpm sbom
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-reports
          path: |
            PROFESSIONAL_READINESS_REMEDIATION.md
            REMEDIATION_TEST_REPORT.md
            PHI_SERVER_GATE_PLAN.md
            sbom.dependencies.json

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
